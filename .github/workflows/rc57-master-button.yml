name: RC5.7 Master Project button

on:
  push:
    branches:
      - rc5.7-multi-user
    paths:
      - .github/workflows/rc57-master-button.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc5.7-multi-user
      - name: Point Master Project button to manager
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/workspace.tsx')
          s = p.read_text()
          old = "<button className=\"project-switch\" onClick={() => navigateTo('projects')}><span>Current master project</span><b>{currentMaster?.name || project.name}</b><small>Switch master projects</small></button>"
          new = "<button className=\"project-switch\" onClick={openMasterProjectManager}><span>Current master project</span><b>{currentMaster?.name || project.name}</b><small>Manage master projects</small></button>"
          if old not in s:
              raise SystemExit('Master Project sidebar button target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit minimal navigation change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rc57-master-button.yml
          git add app/workspace.tsx
          git commit -m "RC5.7 make Master Project button open manager"
          git push origin HEAD:rc5.7-multi-user
