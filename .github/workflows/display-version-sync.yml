name: Stage display version source-of-truth sync

on:
  push:
    branches:
      - cleanup/display-version-sync-20260927

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: https://ci.scopelogic.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cleanup/display-version-sync-20260927

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Align displayed version and add guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workspace_path = Path('app/master-projects/[id]/master-workspace-client.tsx')
          verifier_path = Path('scripts/verify-recovery-source.mjs')

          workspace = workspace_path.read_text()
          old = '<span>v1.0 RC5.7</span>'
          new = '<span>v1.0 RC5.6.0</span>'
          count = workspace.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale Master Project display version; found {count}.')
          workspace_path.write_text(workspace.replace(old, new, 1))

          verifier = verifier_path.read_text()
          marker = "if (typeof applicationVersion !== 'string' || !applicationVersion.trim()) {\n  violations.push('package.json: application version must be a non-empty string');\n}\n"
          guard = """const applicationDisplayVersion = typeof applicationVersion === 'string'
  ? applicationVersion.replace(/^1\\.0\\.0-rc\\./, 'v1.0 RC')
  : '';
const masterWorkspaceClient = await readFile(join(root, 'app', 'master-projects', '[id]', 'master-workspace-client.tsx'), 'utf8');
if (applicationDisplayVersion && !masterWorkspaceClient.includes(`<span>${applicationDisplayVersion}</span>`)) {
  violations.push(`app/master-projects/[id]/master-workspace-client.tsx: displayed version must match package.json (${applicationDisplayVersion})`);
}
"""
          if 'const applicationDisplayVersion =' not in verifier:
              if marker not in verifier:
                  raise SystemExit('Could not locate application version validation block.')
              verifier = verifier.replace(marker, marker + guard, 1)
          verifier_path.write_text(verifier)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check
        run: npm run build

      - name: Commit verified sync
        run: |
          git rm -f .github/workflows/display-version-sync.yml
          git add app/master-projects/'[id]'/master-workspace-client.tsx scripts/verify-recovery-source.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep displayed application version aligned with package version"
          git push origin HEAD:cleanup/display-version-sync-20260927
