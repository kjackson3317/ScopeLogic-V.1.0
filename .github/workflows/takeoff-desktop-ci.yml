name: Takeoff Desktop CI

on:
  push:
    branches:
      - feature/takeoff-desktop-phase-1
      - 'feature/takeoff-v1-*'
    paths:
      - 'desktop/takeoff/**'
      - '.github/workflows/takeoff-desktop-ci.yml'
  pull_request:
    paths:
      - 'desktop/takeoff/**'
      - '.github/workflows/takeoff-desktop-ci.yml'
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/takeoff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run test
      - run: npm run build

  native-check:
    name: Tauri native check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/takeoff
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  windows-test-build:
    name: Windows test executable
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/takeoff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run test
      - name: Generate native icon set from ScopeLogic PNG
        run: npx tauri icon src-tauri/icons/icon.png
      - run: npm run desktop:build
      - name: Upload unsigned test executable
        uses: actions/upload-artifact@v4
        with:
          name: scopelogic-takeoff-windows-test
          path: desktop/takeoff/src-tauri/target/release/scopelogic-takeoff.exe
          if-no-files-found: error
          retention-days: 14

  source-review-package:
    name: Source review package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source-only review ZIP
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/ScopeLogic-Takeoff-Source"
          mkdir -p "$STAGE"
          cp -R desktop/takeoff/. "$STAGE/"
          rm -rf "$STAGE/node_modules" "$STAGE/dist" "$STAGE/src-tauri/target"
          cat > "$STAGE/SOURCE_REVIEW_MANIFEST.txt" <<EOF
          ScopeLogic Takeoff source review package
          Repository: $GITHUB_REPOSITORY
          Branch: $GITHUB_REF_NAME
          Commit: $GITHUB_SHA
          Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          Included: desktop/takeoff source, tests, configuration, and Tauri/Rust shell.
          Excluded: node_modules, dist, compiled src-tauri/target output.
          EOF
          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/ScopeLogic-Takeoff-Source-Review.zip" ScopeLogic-Takeoff-Source
      - name: Upload source review ZIP
        uses: actions/upload-artifact@v4
        with:
          name: scopelogic-takeoff-source-review
          path: ScopeLogic-Takeoff-Source-Review.zip
          if-no-files-found: error
          retention-days: 14

# V1 validation covers raw-count unit tests, the React/Vite frontend, the native
# Tauri shell, an unsigned Windows executable, and a source-only review package.
