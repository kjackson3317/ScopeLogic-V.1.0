name: Stage native dialog cleanup

on:
  push:
    branches:
      - cleanup/native-dialogs-20260926

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: https://ci.scopelogic.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cleanup/native-dialogs-20260926

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Replace browser-native dialogs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          # Drawing Take Off calibration prompt.
          path = Path('app/drawing-takeoff.tsx')
          text = path.read_text()
          if "../lib/client-dialog" not in text:
              text = text.replace("import { useEffect, useMemo, useRef, useState, type KeyboardEvent as ReactKeyboardEvent, type MouseEvent as ReactMouseEvent, type WheelEvent as ReactWheelEvent } from 'react';\n", "import { useEffect, useMemo, useRef, useState, type KeyboardEvent as ReactKeyboardEvent, type MouseEvent as ReactMouseEvent, type WheelEvent as ReactWheelEvent } from 'react';\nimport { showAppPrompt } from '../lib/client-dialog';\n", 1)
          text = replace_once(text, "  const finishDraft = () => {", "  const finishDraft = async () => {", 'drawing finishDraft')
          text = replace_once(text, "      const real = Number(window.prompt('Known real distance in feet:', '10'));", "      const entered = await showAppPrompt({ title: 'Calibrate Drawing', message: 'Enter the known real distance in feet.', initialValue: '10', placeholder: 'Distance in feet', confirmLabel: 'Save Calibration' });\n      const real = Number(entered);", 'drawing calibration prompt')
          path.write_text(text)

          # Main workspace dialogs.
          path = Path('app/workspace.tsx')
          text = path.read_text()
          if "../lib/client-dialog" not in text:
              text = text.replace("import { createClient } from '../lib/supabase/client';\n", "import { createClient } from '../lib/supabase/client';\nimport { showAppConfirm, showAppPrompt } from '../lib/client-dialog';\n", 1)

          text = replace_once(text, "  const confirm = async () => {", "  const submitDialog = async () => {", 'AppDialog local confirm')
          text = replace_once(text, "onKeyDown={(event) => event.key === 'Enter' && confirm()}", "onKeyDown={(event) => event.key === 'Enter' && submitDialog()}", 'AppDialog enter handler')
          text = replace_once(text, "onClick={confirm}>{dialog.confirmLabel", "onClick={submitDialog}>{dialog.confirmLabel", 'AppDialog click handler')
          text = replace_once(text, "function ReleaseSelectionDialog({ selection, change, close, confirm }: { selection: ReleaseSelection; change: (selection: ReleaseSelection | null) => void; close: () => void; confirm: (selection: ReleaseSelection) => void | Promise<void> })", "function ReleaseSelectionDialog({ selection, change, close, onGenerate }: { selection: ReleaseSelection; change: (selection: ReleaseSelection | null) => void; close: () => void; onGenerate: (selection: ReleaseSelection) => void | Promise<void> })", 'ReleaseSelectionDialog prop')
          text = replace_once(text, "onClick={() => confirm(selection)}>Generate Release", "onClick={() => onGenerate(selection)}>Generate Release", 'ReleaseSelectionDialog action')
          text = text.replace(" confirm={", " onGenerate={")

          text = replace_once(text,
              "  const removeCustomer = () => { if (!selected || !window.confirm(`Delete ${selected.name || 'this customer'}? This cannot be undone.`)) return; const next = working.filter((item) => item.id !== selected.id); setWorking(next); setSelectedId(next[0]?.id || ''); save(next); message('Deleted', 'The customer was removed from the global Customer Database.'); };",
              "  const removeCustomer = async () => { if (!selected) return; if (!await showAppConfirm({ title: 'Delete Customer', message: `Delete ${selected.name || 'this customer'}? This cannot be undone.`, confirmLabel: 'Delete Customer', danger: true })) return; const next = working.filter((item) => item.id !== selected.id); setWorking(next); setSelectedId(next[0]?.id || ''); save(next); message('Deleted', 'The customer was removed from the global Customer Database.'); };",
              'removeCustomer')
          text = replace_once(text,
              "  const removePart=(part:PartRecord)=>{if(!window.confirm(`Remove ${part.partNumber || part.description || 'this part'} from the Parts Database? The removal is not permanent until Save Parts Database is clicked.`))return;setNewPartIds((ids)=>ids.filter((id)=>id!==part.id));setWorking((items)=>items.filter((item)=>item.id!==part.id));};",
              "  const removePart=async(part:PartRecord)=>{if(!await showAppConfirm({title:'Remove Part',message:`Remove ${part.partNumber || part.description || 'this part'} from the Parts Database? The removal is not permanent until Save Parts Database is clicked.`,confirmLabel:'Remove Part',danger:true}))return;setNewPartIds((ids)=>ids.filter((id)=>id!==part.id));setWorking((items)=>items.filter((item)=>item.id!==part.id));};",
              'removePart')
          text = replace_once(text,
              "  const deleteTemplate=()=>{if(!template||!window.confirm(`Delete ${template.name || 'this quote template'}? This cannot be undone after saving.`))return;const next=working.filter((item)=>item.id!==template.id);setWorking(next);setSelectedId(next[0]?.id||'');};",
              "  const deleteTemplate=async()=>{if(!template)return;if(!await showAppConfirm({title:'Delete Quote Template',message:`Delete ${template.name || 'this quote template'}? This cannot be undone after saving.`,confirmLabel:'Delete Template',danger:true}))return;const next=working.filter((item)=>item.id!==template.id);setWorking(next);setSelectedId(next[0]?.id||'');};",
              'deleteTemplate')
          text = replace_once(text,
              "  const deleteQuote=()=>{if(!quote||quote.locked||!window.confirm(`Delete ${quote.number} — ${quote.name}? This cannot be undone.`))return;const next=workingQuotes.filter((item)=>item.id!==quote.id);setWorkingQuotes(next);setQuotes(next);setSelectedId(next[0]?.id||'');setDirty(false);message('Deleted','The quote was deleted.');};",
              "  const deleteQuote=async()=>{if(!quote||quote.locked)return;if(!await showAppConfirm({title:'Delete Quote',message:`Delete ${quote.number} — ${quote.name}? This cannot be undone.`,confirmLabel:'Delete Quote',danger:true}))return;const next=workingQuotes.filter((item)=>item.id!==quote.id);setWorkingQuotes(next);setQuotes(next);setSelectedId(next[0]?.id||'');setDirty(false);message('Deleted','The quote was deleted.');};",
              'deleteQuote')
          text = replace_once(text, "  const createRevision=()=>{", "  const createRevision=async()=>{", 'createRevision async')
          text = replace_once(text,
              "    const reason=window.prompt('Revision reason: Pricing Update, Scope Change, Customer Request, Addendum/RFI, Value Engineering, Alternate Revision, or Other','Pricing Update')?.trim();",
              "    const reason=(await showAppPrompt({title:'Create Quote Revision',message:'Revision reason: Pricing Update, Scope Change, Customer Request, Addendum/RFI, Value Engineering, Alternate Revision, or Other.',initialValue:'Pricing Update',placeholder:'Revision reason',confirmLabel:'Continue'}))?.trim();",
              'revision reason')
          text = replace_once(text,
              "    const refresh=window.confirm('Refresh this revision to current database pricing? Choose Cancel to keep all prior revision pricing.');",
              "    const refresh=await showAppConfirm({title:'Refresh Revision Pricing',message:'Refresh this revision to current database pricing? Choose Cancel to keep all prior revision pricing.',confirmLabel:'Refresh Pricing'});",
              'revision refresh')
          text = replace_once(text,
              "    const refreshMaterial=refresh&&window.confirm('Refresh Material Costs / Part Pricing?');",
              "    const refreshMaterial=refresh&&await showAppConfirm({title:'Refresh Material Pricing',message:'Refresh Material Costs / Part Pricing?',confirmLabel:'Refresh Material'});",
              'revision material')
          text = replace_once(text,
              "    const refreshLabor=refresh&&window.confirm('Refresh Labor Rates and database-linked labor units?');",
              "    const refreshLabor=refresh&&await showAppConfirm({title:'Refresh Labor Pricing',message:'Refresh Labor Rates and database-linked labor units?',confirmLabel:'Refresh Labor'});",
              'revision labor')
          text = replace_once(text,
              "    const preserveDifferingPrices=Boolean(refreshMaterial&&differingPrices.length&&window.confirm(`${differingPrices.length} quote price${differingPrices.length===1?' differs':'s differ'} from the current parts database. Choose OK to preserve those quote-specific prices, or Cancel to replace them with current database prices.`));",
              "    const preserveDifferingPrices=Boolean(refreshMaterial&&differingPrices.length&&await showAppConfirm({title:'Preserve Quote-Specific Prices',message:`${differingPrices.length} quote price${differingPrices.length===1?' differs':'s differ'} from the current parts database. Preserve those quote-specific prices? Choose Cancel to replace them with current database prices.`,confirmLabel:'Preserve Prices'}));",
              'revision preserve prices')
          text = replace_once(text,
              "  const deleteAlternate=(id:string)=>{if(!quote||!window.confirm('Delete this alternate and all of its BOM rows? This cannot be undone after saving.'))return;patchQuote({alternates:(quote.alternates||[]).filter((alternate)=>alternate.id!==id),lines:quote.lines.filter((line)=>line.alternateId!==id)});setActiveBomTab('base');};",
              "  const deleteAlternate=async(id:string)=>{if(!quote)return;if(!await showAppConfirm({title:'Delete Alternate',message:'Delete this alternate and all of its BOM rows? This cannot be undone after saving.',confirmLabel:'Delete Alternate',danger:true}))return;patchQuote({alternates:(quote.alternates||[]).filter((alternate)=>alternate.id!==id),lines:quote.lines.filter((line)=>line.alternateId!==id)});setActiveBomTab('base');};",
              'deleteAlternate')
          text = replace_once(text,
              "  const deleteBreakout=(id:string)=>{if(!quote||!window.confirm('Delete this breakout? Its allocated quantities will become Unassigned.'))return;patchQuote({breakouts:(quote.breakouts||[]).filter((breakout)=>breakout.id!==id),lines:quote.lines.map((line)=>{const allocations={...(line.breakoutAllocations||{})};delete allocations[id];return{...line,breakoutId:'',breakoutAllocations:allocations};})});};",
              "  const deleteBreakout=async(id:string)=>{if(!quote)return;if(!await showAppConfirm({title:'Delete Breakout',message:'Delete this breakout? Its allocated quantities will become Unassigned.',confirmLabel:'Delete Breakout',danger:true}))return;patchQuote({breakouts:(quote.breakouts||[]).filter((breakout)=>breakout.id!==id),lines:quote.lines.map((line)=>{const allocations={...(line.breakoutAllocations||{})};delete allocations[id];return{...line,breakoutId:'',breakoutAllocations:allocations};})});};",
              'deleteBreakout')
          path.write_text(text)

          # Master Projects confirmations.
          path = Path('app/master-projects/master-projects-client.tsx')
          text = path.read_text()
          if "../../lib/client-dialog" not in text:
              text = text.replace("import { createClient } from '../../lib/supabase/client';\n", "import { createClient } from '../../lib/supabase/client';\nimport { showAppConfirm } from '../../lib/client-dialog';\n", 1)
          text = replace_once(text, "    if (!window.confirm(`Archive ${selected.project_number} - ${selected.name}?`)) return;", "    if (!await showAppConfirm({ title: 'Archive Master Project', message: `Archive ${selected.project_number} - ${selected.name}?`, confirmLabel: 'Archive' })) return;", 'archive master')
          text = replace_once(text, "    if (!window.confirm(`Permanently delete ${selected.project_number} - ${selected.name}? This cannot be undone.`)) return;", "    if (!await showAppConfirm({ title: 'Delete Master Project', message: `Permanently delete ${selected.project_number} - ${selected.name}? This cannot be undone.`, confirmLabel: 'Delete Project', danger: true })) return;", 'delete master')
          path.write_text(text)

          # Master Project workspace confirmations.
          path = Path('app/master-projects/[id]/master-workspace-client.tsx')
          text = path.read_text()
          if "../../../lib/client-dialog" not in text:
              text = text.replace("import { createClient } from '../../../lib/supabase/client';\n", "import { createClient } from '../../../lib/supabase/client';\nimport { showAppConfirm } from '../../../lib/client-dialog';\n", 1)
          text = replace_once(text,
              " const deleteEvent=async(id:string)=>{if(!window.confirm('Delete this calendar event?'))return;setBusy(true);const {error}=await supabase.from('master_project_calendar_events').delete().eq('id',id);setBusy(false);if(error)return setActionError(error.message);await load();setSuccess('Calendar event deleted successfully.')};",
              " const deleteEvent=async(id:string)=>{if(!await showAppConfirm({title:'Delete Calendar Event',message:'Delete this calendar event?',confirmLabel:'Delete Event',danger:true}))return;setBusy(true);const {error}=await supabase.from('master_project_calendar_events').delete().eq('id',id);setBusy(false);if(error)return setActionError(error.message);await load();setSuccess('Calendar event deleted successfully.')};",
              'delete event')
          text = replace_once(text,
              " const deleteSlr=async(x:MasterFinding)=>{if(!window.confirm(`Delete ${x.display_number}? This removes it from the shared Master Project baseline.`))return;setBusy(true);const {error}=await supabase.from('master_project_findings').delete().eq('id',x.id);setBusy(false);if(error)return setActionError(error.message);await load();setSuccess(`${x.display_number} was deleted successfully.`)};",
              " const deleteSlr=async(x:MasterFinding)=>{if(!await showAppConfirm({title:'Delete SLR',message:`Delete ${x.display_number}? This removes it from the shared Master Project baseline.`,confirmLabel:'Delete SLR',danger:true}))return;setBusy(true);const {error}=await supabase.from('master_project_findings').delete().eq('id',x.id);setBusy(false);if(error)return setActionError(error.message);await load();setSuccess(`${x.display_number} was deleted successfully.`)};",
              'delete SLR')
          path.write_text(text)

          # Retire the legacy allowlist: every native dialog occurrence now fails verification.
          path = Path('scripts/verify-recovery-source.mjs')
          text = path.read_text()
          text = re.sub(r"const legacyDialogDebt = new Set\(\[[\s\S]*?\]\);", "const legacyDialogDebt = new Set();", text, count=1)
          text = text.replace("if (legacyDialogDebt.size) console.log('Known native-dialog debt remains isolated to the existing legacy allowlist; new occurrences fail verification.');\n", "")
          path.write_text(text)

          # Assert there are no exact browser-native dialog calls or local false-positive calls left.
          pattern = re.compile(r'\\b(?:window\\.)?(?:alert|confirm|prompt)\\s*\\(')
          leftovers = []
          for root in (Path('app'), Path('lib')):
              for source in root.rglob('*'):
                  if source.suffix not in {'.ts', '.tsx', '.js', '.jsx', '.mjs'}:
                      continue
                  for line_no, line in enumerate(source.read_text(errors='ignore').splitlines(), 1):
                      if pattern.search(line):
                          leftovers.append(f'{source}:{line_no}: {line.strip()}')
          if leftovers:
              raise SystemExit('Native dialog cleanup incomplete:\n' + '\n'.join(leftovers))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check
        run: npm run build

      - name: Commit verified cleanup
        run: |
          git rm -f .github/workflows/native-dialog-inventory.yml .github/workflows/native-dialog-cleanup.yml
          git add app lib scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace browser-native dialogs with ScopeLogic dialogs"
          git push origin HEAD:cleanup/native-dialogs-20260926
