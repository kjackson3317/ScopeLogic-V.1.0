name: Stage Version Source-of-Truth Fix

on:
  push:
    branches:
      - cleanup/version-source-of-truth-20260926

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: https://ci.scopelogic.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cleanup/version-source-of-truth-20260926

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Align snapshot version and add build guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controller_path = Path('app/review-release-controller.tsx')
          verifier_path = Path('scripts/verify-recovery-source.mjs')

          controller = controller_path.read_text()
          old = "applicationVersion:'1.0.0-rc.5.7.0'"
          new = "applicationVersion:'1.0.0-rc.5.6.0'"
          count = controller.count(old)
          if count == 1:
              controller = controller.replace(old, new, 1)
              controller_path.write_text(controller)
          elif new not in controller:
              raise SystemExit(f'Expected one stale review release applicationVersion; found {count}.')

          verifier = verifier_path.read_text()
          package_guard = """const packageJson = JSON.parse(await readFile(join(root, 'package.json'), 'utf8'));
          const applicationVersion = packageJson.version;
          if (typeof applicationVersion !== 'string' || !applicationVersion.trim()) {
            violations.push('package.json: application version must be a non-empty string');
          }
          """
          marker = "const violations = [];\n"
          if "const applicationVersion = packageJson.version;" not in verifier:
              if marker not in verifier:
                  raise SystemExit('Could not locate verifier violations marker.')
              verifier = verifier.replace(marker, marker + package_guard, 1)

          version_scan = """
            for (const match of content.matchAll(/\\bapplicationVersion\\s*:\\s*['\"]([^'\"]+)['\"]/g)) {
              if (match[1] !== applicationVersion) {
                violations.push(`${displayPath}: applicationVersion ${match[1]} must match package.json version ${applicationVersion}`);
              }
            }
          """
          display_marker = "  const displayPath = relative(root, filePath).replaceAll('\\\\', '/');\n"
          if "applicationVersion ${match[1]} must match package.json version" not in verifier:
              if display_marker not in verifier:
                  raise SystemExit('Could not locate verifier source-file marker.')
              verifier = verifier.replace(display_marker, display_marker + version_scan, 1)

          verifier_path.write_text(verifier)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build and verify source
        run: npm run build

      - name: Commit verified version fix
        run: |
          git add app/review-release-controller.tsx scripts/verify-recovery-source.mjs
          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align release snapshots with package application version"
          git push origin HEAD:cleanup/version-source-of-truth-20260926
