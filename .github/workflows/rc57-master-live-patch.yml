name: RC57 Master Live Patch

on:
  push:
    branches:
      - rc5.7-multi-user
    paths:
      - .github/workflows/rc57-master-live-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc5.7-multi-user
          fetch-depth: 0
      - name: Patch live workspace
        run: python scripts/rc57-master-live-patch.py
      - name: Commit patched workspace
        run: |
          git config user.name "ScopeLogic RC5.7 Builder"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/rc57-master-live-patch.yml scripts/rc57-master-live-patch.py
          git add app/workspace.tsx
          git commit -m "RC5.7 add Master Projects without changing live workflows"
          git push origin HEAD:rc5.7-multi-user
