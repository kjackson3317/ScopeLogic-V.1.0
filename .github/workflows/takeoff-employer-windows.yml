name: Employer Takeoff Windows Installer

on:
  push:
    branches:
      - demo/employer-takeoff-desktop
    paths:
      - 'desktop/takeoff/**'
      - '.github/workflows/takeoff-employer-windows.yml'
  workflow_dispatch:

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/takeoff
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Validate frontend
        run: npm run build

      - name: Generate neutral source icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $path = Join-Path (Resolve-Path 'src-tauri/icons').Path 'icon.png'
          $bmp = New-Object System.Drawing.Bitmap 512,512
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::FromArgb(245,247,248))
          $green = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(49,81,59))
          $white = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
          $pen = New-Object System.Drawing.Pen([System.Drawing.Color]::White,28)
          $pen.StartCap = [System.Drawing.Drawing2D.LineCap]::Round
          $pen.EndCap = [System.Drawing.Drawing2D.LineCap]::Round
          $g.FillRoundedRectangle = $null
          $g.FillRectangle($green,64,64,384,384)
          $g.DrawLine($pen,156,168,356,168)
          $g.DrawLine($pen,256,168,256,356)
          $g.FillEllipse($white,226,326,60,60)
          $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
          $pen.Dispose(); $green.Dispose(); $white.Dispose(); $g.Dispose(); $bmp.Dispose()

      - name: Generate native application icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build Tauri Windows installers
        run: npm run desktop:bundle

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Technology-Preconstruction-Takeoff-Windows
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/takeoff/src-tauri/target/release/bundle/msi/*.msi
            desktop/takeoff/src-tauri/target/release/bundle/nsis/*.exe
