[package]
name = "scopelogic-takeoff"
version = "0.1.0"
description = "ScopeLogic Takeoff desktop application"
authors = ["ScopeLogic"]
edition = "2021"

[lib]
name = "scopelogic_takeoff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
