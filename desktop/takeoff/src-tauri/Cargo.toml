[package]
name = "technology-preconstruction-takeoff"
version = "0.1.0"
description = "Technology Preconstruction Takeoff desktop application"
authors = ["Technology Preconstruction"]
edition = "2021"

[lib]
name = "technology_preconstruction_takeoff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
